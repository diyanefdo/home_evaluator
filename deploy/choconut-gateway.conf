map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_cf_connecting_ip $upstream_real_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    listen 8000;
    server_name _;
    absolute_redirect off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /gateway-healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Choconut's static homepage owns only the apex path and its assets. The
    # path-specific application routes below continue to use their own origins.
    location = / {
        root /srv/choconut-home;
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        root /srv/choconut-home;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /nutflix {
        return 308 /nutflix/$is_args$args;
    }

    location ^~ /nutflix/ {
        set $nutflix_origin http://nutflix:8001;
        rewrite ^/nutflix/(.*)$ /$1 break;
        proxy_pass $nutflix_origin$uri$is_args$args;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $upstream_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /budgeting_beaver {
        return 308 /budgeting_beaver/$is_args$args;
    }

    # This internal subrequest validates the same signed Google session used by
    # Home Evaluator. Its response supplies the identity that nginx injects
    # into Budgeting Beaver; client-provided identity headers are overwritten.
    location = /_budgeting_beaver_auth {
        internal;
        set $evaluator_origin http://home-evaluator-app:8000;
        proxy_pass $evaluator_origin/home_evaluator/auth/budget-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location @budget_google_login {
        return 303 /home_evaluator/login?next=/budgeting_beaver/;
    }

    location ^~ /budgeting_beaver/ {
        auth_request /_budgeting_beaver_auth;
        auth_request_set $budget_email $upstream_http_x_authenticated_email;
        auth_request_set $budget_user_id $upstream_http_x_authenticated_user_id;
        auth_request_set $budget_owner $upstream_http_x_budget_owner;
        error_page 401 = @budget_google_login;

        set $budget_origin http://budgetting-beaver-app:8080;
        proxy_pass $budget_origin$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $upstream_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header X-Budget-Authenticated-Email $budget_email;
        proxy_set_header X-Budget-Authenticated-User-ID $budget_user_id;
        proxy_set_header X-Budget-Owner $budget_owner;
        proxy_set_header Connection "";
        proxy_read_timeout 3m;
    }

    location = /home_evaluator {
        return 308 /home_evaluator/$is_args$args;
    }

    # The auth-check endpoint is for nginx subrequests, not direct browsers.
    location = /home_evaluator/auth/budget-check {
        return 404;
    }

    location ^~ /home_evaluator/ {
        set $evaluator_origin http://home-evaluator-app:8000;
        proxy_pass $evaluator_origin$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $upstream_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_set_header Connection "";
        proxy_read_timeout 5m;
    }

    location / {
        return 404;
    }
}
